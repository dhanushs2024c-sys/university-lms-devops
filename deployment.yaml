
apiVersion: apps/v1
kind: Deployment
metadata:
  name: university-lms
  labels:
    app: university-lms
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: university-lms
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: university-lms
    spec:
      containers:
        - name: university-lms
          image: dhan01/university-lms:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: university-lms-service
spec:
  type: NodePort
  selector:
    app: university-lms
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30010
